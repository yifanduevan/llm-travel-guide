# This is a basic workflow to get started with Actions

name: CI

on:
  push:
    branches: [ "main" , "ci-coverage" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ece651
          POSTGRES_USER: ece651
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ece651 -d ece651"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/ece651
      DB_USER: ece651
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: src/backend
        run: mvn -B test
        # run: ./mvnw -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Run frontend unit tests with coverage
        working-directory: src/frontend
        env:
          CI: true
        run: npm run test -- --coverage --watch=false
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: src/frontend/coverage
          if-no-files-found: warn
      # - name: Lint
      #   working-directory: src/frontend
      #   run: npm run lint
      - name: Build
        working-directory: src/frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: src/frontend
        env:
          CI: true
        run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report
            src/frontend/test-results
          if-no-files-found: ignore
