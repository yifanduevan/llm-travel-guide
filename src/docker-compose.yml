services:
  db:
    image: postgres:16
    container_name: travelagent_db
    environment:
      POSTGRES_DB: travelagent
      POSTGRES_USER: travelagent
      POSTGRES_PASSWORD: travelagent
    ports:
      - "5432:5432"
    volumes:
      - travelagent_pgdata:/var/lib/postgresql/data

volumes:
  travelagent_pgdata:
