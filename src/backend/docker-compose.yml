version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ece651-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ece651
      POSTGRES_USER: ece651
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ece651 -d ece651"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
