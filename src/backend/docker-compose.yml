services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ece651
      POSTGRES_USER: ece651
      POSTGRES_PASSWORD: password
    expose:
      - "5432"
    volumes:
      - ece651_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ece651
      SPRING_DATASOURCE_USERNAME: ece651
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080" 

volumes:
  ece651_pgdata:
