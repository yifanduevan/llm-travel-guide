spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/ece651?stringtype=unspecified}
    username: ${DB_USER:ece651}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  web:
    mvc:
      cors:
        mappings:
          "/api/**":
            allowed-origins: "http://localhost:3000"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

logging:
  level:
    org.flywaydb.core: info
    org.hibernate.SQL: debug
