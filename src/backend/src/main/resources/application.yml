spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ece651?stringtype=unspecified}
    username: ${DB_USER:ece651}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  level:
    org.flywaydb.core: info
    org.hibernate.SQL: debug

app:
  auth:
    demo:
      email: ${DEMO_USER_EMAIL:demo@example.com}
      # Interim workaround: reassign existing trips to demo user at startup.
      backfill-trip-ownership: ${DEMO_USER_BACKFILL_TRIPS:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  llm:
    runtime:
      # managed-api: use provider-managed API endpoints (e.g., api.openai.com)
      # aws-service: use an AWS-hosted internal LLM proxy/service endpoint
      mode: ${LLM_RUNTIME_MODE:managed-api}
    secrets:
      # env | aws-secrets-manager | aws-ssm
      provider: ${LLM_SECRET_PROVIDER:env}
    openai:
      # For local/dev fallback only. Production should use AWS Secrets Manager or SSM.
      api-key: ${OPENAI_API_KEY:}
      # Secret reference for the API key. If provider=aws-secrets-manager use secret id/arn.
      # If provider=aws-ssm use secure parameter name.
      api-key-secret-ref: ${OPENAI_API_KEY_SECRET_REF:}
      chat-completions-url: ${OPENAI_CHAT_URL:https://api.openai.com/v1/chat/completions}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      endpoint: ${OPENAI_ENDPOINT:https://api.openai.com/v1/responses}
    aws-service:
      # Required only when LLM_RUNTIME_MODE=aws-service
      chat-completions-url: ${AWS_LLM_CHAT_URL:}
      responses-endpoint: ${AWS_LLM_RESPONSES_URL:}
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    # Staging should point to RDS or another managed Postgres instance.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Production must use runtime-injected DB credentials (e.g., RDS).
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
